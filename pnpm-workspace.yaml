# The automerge and keyhive packages are version-locked to each other, and
# several of them are WASM-backed, where a duplicate copy is a separate module
# instance rather than a shared one. The catalog is the one place their versions
# are written. package.json and the overrides below both refer back to it, so a
# bump is a single edit and the two cannot drift apart.
catalog:
  "@automerge/automerge": 3.3.2
  "@automerge/automerge-repo": 2.6.0-subduction.48
  "@automerge/automerge-repo-keyhive": 0.5.0-alpha.5b
  "@automerge/automerge-repo-storage-indexeddb": 2.6.0-subduction.48
  "@automerge/automerge-subduction": 0.16.1
  "@automerge/keyhive-react": 0.1.0-alpha.3
  "@automerge/react": 2.6.0-subduction.48
  "@keyhive/keyhive": 0.1.0-alpha.8

# Transitive copies of the WASM-backed packages, pulled in by
# automerge-repo-keyhive, forced onto the catalog version as well.
overrides:
  "@automerge/automerge-repo": "catalog:"
  "@automerge/automerge-subduction": "catalog:"

onlyBuiltDependencies:
  - esbuild
