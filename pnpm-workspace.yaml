catalog:
  "@automerge/automerge": 3.3.2
  "@automerge/automerge-repo": 2.6.0-subduction.48
  "@automerge/automerge-repo-keyhive": 0.5.0-alpha.6
  "@automerge/automerge-repo-storage-indexeddb": 2.6.0-subduction.48
  "@automerge/automerge-subduction": 0.16.1
  "@automerge/keyhive-react": 0.1.0-alpha.3
  "@automerge/react": 2.6.0-subduction.48
  "@inkandswitch/onomancy": 0.1.0
  "@keyhive/keyhive": 0.1.0-alpha.8

# Transitive copies of the WASM-backed packages, pulled in by
# automerge-repo-keyhive. Onomancy is deliberately absent here: it is a
# distinct Wasm module rather than a second copy of one of these, so there is
# no duplicate to collapse onto a single instance.
overrides:
  "@automerge/automerge-repo": "catalog:"
  "@automerge/automerge-subduction": "catalog:"
  # TEMPORARY, and it breaks reproducibility. The onomancy exports Phase 2
  # needs (useOnomancyDirectory, DnsNameBadge, AccountView showDnsName) are not
  # in the published 0.1.0-alpha.3, so this points at a local pre-release
  # tarball built from the keyhive-react `onomancy` branch.
  #
  # A tarball rather than a `link:` because the two repositories are in
  # separate sandbox mount namespaces and cannot see each other's working
  # trees. It is the better artifact regardless: fixed contents, verifiable by
  # checksum, rather than a live view of another tree.
  #
  #   sha256 344069e7932da4be395d12fd3549fdcc6dd731b2d0aad4250299e96127e34c22
  #
  # REVERT to `catalog:` once a real version is published. Until then
  # `pnpm install --frozen-lockfile` cannot work on a machine without this
  # file, so .github/workflows/deploy.yml and the flake's `ci` are both broken.
  "@automerge/keyhive-react": "file:/home/expede/.pi/bridge/automerge-keyhive-react-0.1.0-alpha.5.tgz"

onlyBuiltDependencies:
  - esbuild
