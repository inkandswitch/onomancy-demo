# Deploys the built demo to GitHub Pages.
#
# The build needs a phonebook document id. It is deployment-specific rather
# than hardcoded (see "Phonebook configuration" in the README), so set it as a
# repository variable named PHONEBOOK_DOC_ID under
# Settings > Secrets and variables > Actions > Variables. Generate a value with
# `pnpm gen:phonebook-id`. It is not a secret: the id is visible in the built
# bundle, and the phonebook it names is unencrypted by design.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Before setup-node, so its pnpm cache lookup can find the store.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          version: "10"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check PHONEBOOK_DOC_ID is configured
        if: vars.PHONEBOOK_DOC_ID == ''
        run: |
          echo "::error::PHONEBOOK_DOC_ID repository variable is not set." \
            "Generate one with 'pnpm gen:phonebook-id' and add it under" \
            "Settings > Secrets and variables > Actions > Variables."
          exit 1
      - name: Build
        run: pnpm build
        env:
          PHONEBOOK_DOC_ID: ${{ vars.PHONEBOOK_DOC_ID }}
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload dist folder
          path: "./dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
